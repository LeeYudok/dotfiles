# PR과 main push에서 식별자·문법·AGENTS.yaml·밀폐형 시험을 실행한다.
name: 기본 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: 식별자·문법·밀폐형 시험
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 식별자 검사
        run: scripts/check-identifiers.sh
      - name: 문법 검사 도구 설치
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          command -v python3 jq
          if ! command -v zsh >/dev/null; then
            # 러너의 Linuxbrew 경로. 문자 그대로 쓰면 식별자 검사(/home/<이름>)에 걸려 조립한다
            lb=linuxbrew; brew="/home/$lb/.$lb/bin/brew"
            "$brew" install zsh
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$("$brew" --prefix)/bin/zsh" "$RUNNER_TEMP/bin/zsh"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
          "$(command -v zsh || echo "$RUNNER_TEMP/bin/zsh")" --version
      - name: 파일별 문법 검사
        run: scripts/check-syntax.sh
      - name: AGENTS.yaml 검증
        run: scripts/check-agents-yaml.sh
      - name: 밀폐형 시험
        run: |
          for t in test-agy-statusline test-codex-cost-hook test-codex-status-line test-install-safety test-windows-git test-yolo-wrapper; do
            echo "== $t"; bash "scripts/$t.sh"
          done
